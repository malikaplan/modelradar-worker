name: ModelRadar GitHub Worker

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Collector and Send to Cloud VM
        env:
          INGEST_URL: http://35.225.124.42/api/ingest
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          CULTS_USER: ${{ secrets.CULTS_USER }}
          CULTS_KEY: ${{ secrets.CULTS_KEY }}
        run: node worker.js
